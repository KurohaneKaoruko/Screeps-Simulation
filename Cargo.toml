[package]
name = "screeps-sim"
description = "Screeps-Simulation: 本地高速 Screeps 模拟器 (Rust 结算引擎 + V8 JS 宿主)"
version = "0.1.0"
edition = "2021"
license = "ISC"

[[bin]]
name = "screeps-sim"
path = "src/main.rs"

[dependencies]
deno_core = "0.412"
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"

[lib]
name = "screeps_sim"
path = "src/lib.rs"
