name: Release

# 打 tag 发布: git tag v0.1.0 && git push --tags
# 流程: 校验版本 → 各平台构建二进制 (矩阵) → 汇总上传 GitHub Release (含 SHA256SUMS)。
# 分发只走 GitHub Release: JS runner (npm i screeps-sim 或 git 安装) 首次运行时自动下载
# 当前平台的引擎二进制 (SHA256 校验), 不再发布 npm 平台包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本 (需与 package.json / Cargo.toml 一致)'
        required: true
        type: string

permissions:
  contents: write # 建 Release / 传产物

jobs:
  verify:
    name: 版本校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          node scripts/version-check.mjs
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          elif [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" != "$VERSION" ]; then
            echo "输入版本 ${{ inputs.version }} 与仓库版本 $VERSION 不一致"; exit 1
          fi
          echo "版本 $VERSION ✓"

  platforms:
    name: 平台构建 ${{ matrix.key }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # musl / win-arm64 依赖对应平台的 V8 预编译库, 缺失时跳过该目标而不拖垮整体发布
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux-x64-gnu, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # arm64 用原生 ARM runner (公开仓库免费): cross 的 docker 镜像 glibc 太老,
          # 链接新 V8 (WasmMemoryMapDescriptor 用 memfd_create, 需 glibc ≥ 2.27) 会 undefined reference
          - { key: linux-arm64-gnu, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { key: linux-x64-musl, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true, experimental: true }
          - { key: linux-arm64-musl, os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true, experimental: true }
          - { key: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          # Intel macOS runner (macos-13) 已被 GitHub 退役, 队列永远无机器 (等 runner 24h 超时);
          # 改在 ARM runner 上交叉编译 x86_64: Apple 工具链原生支持, rustc 只需装目标 std
          - { key: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { key: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { key: win32-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.key }}
      - uses: taiki-e/install-action@cross # 交叉编译工具链 (仅 linux 交叉目标用得到)
        if: ${{ matrix.cross == true }}
      - name: 构建引擎 (strip 后的裸二进制)
        id: build
        shell: bash
        run: |
          node scripts/build-platform-pkg.mjs --key "${{ matrix.key }}" --rust-target "${{ matrix.target }}" ${{ matrix.cross == true && '--cross' || '' }}
          echo "success=true" >> $GITHUB_OUTPUT
        continue-on-error: ${{ matrix.experimental == true }}
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.success == 'true'
        with:
          name: bin-${{ matrix.key }}
          path: |
            dist/platform/screeps-sim-*
            dist/platform/*.json

  release:
    name: GitHub Release
    needs: [verify, platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist/platform
          pattern: bin-*
          merge-multiple: true

      - name: 校验产物
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/version-check.mjs
          ls -lh dist/platform/screeps-sim-*
          # 各平台清单齐全 (experimental 目标可能缺席, 按 .json 实际到位的算)
          for m in dist/platform/*.json; do
            node -e "const m=require('./$m'); console.log('  ·', m.key, m.version, m.sizeBytes, m.asset)"
          done

      # SHA256SUMS 资产: runner 下载二进制后按它做完整性校验
      - name: 生成 SHA256SUMS
        working-directory: dist/platform
        run: |
          for f in screeps-sim-*; do
            # 去掉 windows 的 .exe 后缀统一资产名口径 (runner 下载时补回)
            echo "$(sha256sum "$f")"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: screeps-sim ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: |
            dist/platform/screeps-sim-*
            dist/platform/SHA256SUMS
